name: Node.js CI Demo

on: [push]

jobs:
  test-project:
    runs-on: ubuntu-latest

    steps:
      # Runner로 내 소스 코드 다운로드
      - name: Check out repository code
        uses: actions/checkout@v6

      # Runner에 Node.js 설치
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # package.json에 적힌 외부 라이브러리들 설치
      - name: Install dependencies
        run: npm ci

      # Jest 테스트 실행
      - name: Run Jest tests
        run: npm test
